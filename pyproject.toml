[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyuicompose_htmltags"
version = "0.1.0"
description = "Implementation of PyUiCompose to html tags"
readme = "README.md"
authors = [
    { name = "francivaldo4334", email = "francivaldodev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyuicompose",
]

[project.scripts]
pyuicompose = "pyuicomposehtmltag:main"

[tool.uv.sources]
pyuicompose = { git = "https://github.com/francivaldo4334/PyUiCompose.git" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyuicompose*"]

[tool.setuptools.package-data]
pyuicompose = ["*.py", "*/*.py"]

