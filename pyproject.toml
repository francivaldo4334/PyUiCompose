[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyuicompose_htmltags"
version = "0.1.0"
description = "Implementation of PyUiCompose to html tags"
readme = "README.md"
authors = [
    { name = "francivaldo4334", email = "francivaldodev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyuicompose",
]

[project.scripts]
pyuicompose = "pyuicompose:main"

[tool.uv.sources]
pyuicompose = { git = "https://github.com/francivaldo4334/PyUiCompose.git" }
