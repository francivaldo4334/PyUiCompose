[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyuicompose"
version = "0.1.0"
description = "Interface to ui declarative"
readme = "README.md"
authors = [
    { name = "francivaldo4334", email = "francivaldodev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pyuicompose = "pyuicompose:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyuicompose*"]
